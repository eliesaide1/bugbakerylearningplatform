<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="bb-mono-title">
  <title id="bb-mono-title">Bug Bakery</title>

  <!--
    Single colour. Everything inherits `currentColor`, so this sits on any
    background: set the colour on the parent element and the mark follows.
    Use it for stamps, invoices, embroidery, or anywhere the two-colour mark
    would not survive.
  -->
  <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
    <path d="M25.5 30C23 22 19.5 17.5 15.5 14.5" />
    <path d="M38.5 30C41 22 44.5 17.5 48.5 14.5" />
  </g>
  <circle cx="15" cy="14" r="3.5" fill="currentColor" />
  <circle cx="49" cy="14" r="3.5" fill="currentColor" />

  <mask id="bb-mono-score">
    <rect width="64" height="64" fill="#fff" />
    <g stroke="#000" stroke-width="3" stroke-linecap="round">
      <path d="M32 29.5V47" />
      <path d="M18.5 42.5 24 37" />
      <path d="M40 37 45.5 42.5" />
    </g>
  </mask>
  <path d="M10 48a22 20 0 0 1 44 0z" fill="currentColor" mask="url(#bb-mono-score)" />

  <path d="M7 51h50" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
</svg>
