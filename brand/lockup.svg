<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-labelledby="bb-lockup-title">
  <title id="bb-lockup-title">Bug Bakery</title>

  <!--
    Horizontal lockup for decks, email signatures and print.

    Note: the wordmark is live text in Bricolage Grotesque. That renders
    correctly wherever the font is installed or loaded, but an <svg> placed in
    an <img> tag cannot fetch webfonts and will fall back to a system sans.
    On the site the header draws the mark from mark.svg and sets the wordmark in
    HTML, so it always gets the real font. Use this file where you control the
    font, or outline the text before sending it out.
  -->

  <g transform="translate(0 0)">
    <g fill="none" stroke="#1B3FD8" stroke-width="3.5" stroke-linecap="round">
      <path d="M25.5 30C23 22 19.5 17.5 15.5 14.5" />
      <path d="M38.5 30C41 22 44.5 17.5 48.5 14.5" />
    </g>
    <circle cx="15" cy="14" r="3.5" fill="#E9A13B" />
    <circle cx="49" cy="14" r="3.5" fill="#E9A13B" />

    <mask id="bb-lockup-score">
      <rect width="64" height="64" fill="#fff" />
      <g stroke="#000" stroke-width="3" stroke-linecap="round">
        <path d="M32 29.5V47" />
        <path d="M18.5 42.5 24 37" />
        <path d="M40 37 45.5 42.5" />
      </g>
    </mask>
    <path d="M10 48a22 20 0 0 1 44 0z" fill="#1B3FD8" mask="url(#bb-lockup-score)" />

    <path d="M7 51h50" fill="none" stroke="#E9A13B" stroke-width="4" stroke-linecap="round" />
  </g>

  <text
    x="74"
    y="40"
    font-family="'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif"
    font-size="27"
    font-weight="800"
    letter-spacing="-0.9"
    fill="#14181F"
  >Bug Bakery</text>

  <text
    x="75"
    y="55"
    font-family="'IBM Plex Mono', ui-monospace, monospace"
    font-size="10.5"
    letter-spacing="0.4"
    fill="#6C7686"
  >software training</text>
</svg>
